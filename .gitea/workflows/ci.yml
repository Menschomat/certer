name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.server_url != 'https://github.com'
    steps:
      - name: Cleanup Disk Space
        run: |
          docker system prune -f || true
          docker image prune -f || true
          df -h
          
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Run Tests
        run: go test -race -v ./...

      - name: Import Secrets from Vault
        id: import-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          namespace: dev
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            certer/secret/data/cicd/registry username | REGISTRY_USERNAME ;
            certer/secret/data/cicd/registry password | REGISTRY_PASSWORD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: registry.dmz.k8s.menscho.space
          username: ${{ steps.import-secrets.outputs.REGISTRY_USERNAME }}
          password: ${{ steps.import-secrets.outputs.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image (Multi-Platform)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.dmz.k8s.menscho.space/m0space/certer:latest
          cache-from: type=registry,ref=registry.dmz.k8s.menscho.space/m0space/certer:latest
